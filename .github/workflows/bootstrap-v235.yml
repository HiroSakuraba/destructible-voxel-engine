name: Expand v2.35 source release

on:
  push:
    branches: ["codex/v2.35-foundations"]

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand source
        shell: bash
        run: |
          cat bootstrap/source.tar.gz.part-* > /tmp/dve-v2.35-source.tar.gz
          echo "ebffdaa0d7ab4780d976c18ffc0ca3194cf03fc48b0f91d6ec3a3d3e14f26b64  /tmp/dve-v2.35-source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/dve-v2.35-source
          tar -xzf /tmp/dve-v2.35-source.tar.gz -C /tmp/dve-v2.35-source
          rm -rf /tmp/dve-v2.35-source/destructible-voxel-engine-v2.35/.github
          cp -a /tmp/dve-v2.35-source/destructible-voxel-engine-v2.35/. .
          rm -rf bootstrap
      - name: Publish browsable source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Expand v2.35 source-only release"
          git push
