name: CI

# Full CTest coverage for the Linux presets, packaging artifacts, and the Windows (MSVC) build,
# tests and sample game ZIP. The focused-contracts, repository-build and dashr-null-rhi jobs stay in
# v235-foundations.yml unchanged, so existing branch-protection check names keep working.

on:
  push:
    branches: [main, "codex/**"]
  # Docs-only pull requests skip CI. Pushes to main are not filtered, so main always gets the
  # full run (including the ASan leg and the source-manifest check, which hashes docs too).
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Nightly ASan run (06:17 UTC); scheduled runs only execute the ASan leg and the manifest check.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Pull requests: one run per PR, superseded runs are cancelled. Pushes to main / schedule /
# dispatch: every run gets its own group, so a push no longer queues behind the 40+ min ASan leg
# of the previous run. The ASan leg serializes itself with a job-level group (see ctest).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Debian trixie matches the development machines: GCC 14 (the dve_player golden framebuffer
  # hashes are keyed GNU-14-*), packaged SDL3/SDL3_ttf, Lua 5.4.
  DVE_APT_PACKAGES: >-
    build-essential cmake ninja-build ccache git python3 pkg-config file xz-utils zstd
    ca-certificates dpkg-dev
    libpng-dev libjpeg-dev liblua5.4-dev libsdl3-dev libsdl3-ttf-dev
    libx11-dev libxext-dev libxft-dev libfreetype-dev libfontconfig-dev
    libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libjack-dev
    libflac-dev libogg-dev libvorbis-dev libopus-dev
    ffmpeg glslang-tools xvfb xauth mold
  # Headless SDL for every test that does not pick its own driver; X11-only tests get xvfb-run.
  SDL_VIDEO_DRIVER: offscreen
  SDL_AUDIO_DRIVER: dummy
  CCACHE_COMPRESS: "true"
  # Each Linux ccache directory is saved as its own Actions cache entry. At 400M the release-type
  # presets were full and thrashed. Budget against GitHub's 10 GB repo quota: 3 release-type
  # presets x 1.2G + ASan 2.5G (overridden in the ctest job) + Windows (~0.6G) ~= 6.7G, with
  # prune-caches keeping only the newest main entry per prefix.
  CCACHE_MAXSIZE: 1200M
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:
  ctest:
    name: ctest (${{ matrix.preset }})
    runs-on: ubuntu-latest
    # Mirrored from Debian trixie by ci-image-mirror.yml; pulled with credentials, not anonymously.
    container:
      image: ghcr.io/hirosakuraba/dve-ci-debian:trixie-build
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The job runs inside the container, so the preinstalled host toolchains (Android SDK, .NET,
      # GHC, Swift) are out of reach. Bind-mount them so the ASan leg can delete them ("Free
      # runner disk" below); nothing else reads these directories. The host tool cache is
      # already mounted at /__t by the runner.
      volumes:
        - /usr/local/lib/android:/host-free/android
        - /usr/share/dotnet:/host-free/dotnet
        - /opt/ghc:/host-free/ghc
        - /usr/local/.ghcup:/host-free/ghcup
        - /usr/share/swift:/host-free/swift
    # linux-gcc-asan builds and runs the same suite under AddressSanitizer and UBSan, which is
    # roughly two to three times slower than a plain Release run.
    timeout-minutes: ${{ matrix.preset == 'linux-gcc-asan' && 300 || 180 }}
    # Only the ASan leg on main serializes (one running + one pending, never cancelled); every other
    # leg gets a unique group, i.e. no job-level limit.
    concurrency:
      group: ${{ matrix.preset == 'linux-gcc-asan' && github.event_name != 'pull_request' && format('ci-asan-{0}', github.ref) || format('ci-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.preset) }}
      cancel-in-progress: false
    # linux-gcc-asan (40-50 min) does not run on pull requests: it runs on pushes to main, nightly
    # (schedule) and on workflow_dispatch. Scheduled runs only build the ASan leg.
    strategy:
      fail-fast: false
      matrix:
        preset: >-
          ${{ fromJSON(
            github.event_name == 'pull_request' && '["linux-gcc-release","linux-gcc-lua-release","linux-gcc-player-release"]'
            || github.event_name == 'schedule' && '["linux-gcc-asan"]'
            || '["linux-gcc-release","linux-gcc-lua-release","linux-gcc-player-release","linux-gcc-asan"]'
          ) }}
    env:
      # ASan objects are ~22x larger than Release ones; 400M made ccache evict nearly everything.
      CCACHE_MAXSIZE: ${{ matrix.preset == 'linux-gcc-asan' && '2500M' || '1200M' }}
      # Test groups (cmake/DveTestCoverage.cmake, docs/honest-test-coverage-2026-10-27.md) this leg
      # MUST build: configuration fails when one is SKIPPED, so a missing package or an edited
      # preset cannot turn a group into a silent "Skipped" in the ctest summary. Not listed on
      # purpose: DXC (the image has no DXC), Box2D/Box3D (no preset here enables them), Lua and Jolt
      # where the preset does not enable them. The hosted runners have no Vulkan device, so the
      # Vulkan tests still skip at run time (DVE_REQUIRE_COMPLETE_TESTS stays unset here).
      DVE_EXPECTED_TEST_GROUPS: >-
        ${{ fromJSON('{"linux-gcc-release":"Vulkan,Editor,Player,AssetPipeline,MeshAuthoring,AudioSynth","linux-gcc-asan":"Vulkan,Editor,Player,AssetPipeline,MeshAuthoring,AudioSynth","linux-gcc-lua-release":"Lua,Vulkan,Editor,Player,AssetPipeline,MeshAuthoring,AudioSynth","linux-gcc-player-release":"Lua,Jolt,Vulkan,Editor,Player,AssetPipeline,MeshAuthoring,AudioSynth"}')[matrix.preset] }}
      # Only sanitizer builds read these. Any UBSan finding fails its test instead of only being
      # printed, and a leak at exit fails it too. LSAN_OPTIONS (set below, it needs the
      # in-container workspace path) points LeakSanitizer at tests/sanitizers/lsan.supp,
      # which ignores one-time allocations inside system libraries (X11, fontconfig, audio).
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Install build and test dependencies
        run: |
          # The trixie-build image (ci-image-mirror.yml) already has these; only a stale image
          # pays for apt here.
          if dpkg -s $DVE_APT_PACKAGES >/dev/null 2>&1; then echo "all packages preinstalled"; exit 0; fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $DVE_APT_PACKAGES
      # linux-gcc-asan links ~380 test executables of 0.2-0.65 GB each (ASan + -g1 + static libraries)
      # into one build tree and ran the runner out of disk ("mold: failed to write to an output
      # file. Disk full?"; the previous green runs ended with 0.9-3 GB free of 145 GB). Delete the
      # preinstalled toolchains this project never uses before building. The other legs have
      # plenty of room and keep them. Best effort: a missing directory is not an error.
      - name: Free runner disk (ASan leg)
        if: matrix.preset == 'linux-gcc-asan'
        run: |
          echo "== before"; df -h /__w
          for d in /host-free/* /__t; do
            [ -d "$d" ] || continue
            echo "removing $(du -sh "$d" 2>/dev/null | cut -f1)  $d"
            find "$d" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          done
          echo "== after"; df -h /__w
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace safe for git and point ccache at it
        # github.workspace is the host path in container jobs; use the in-container path.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache" >> "$GITHUB_ENV"
          echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/tests/sanitizers/lsan.supp:print_suppressions=0" >> "$GITHUB_ENV"
      - name: Restore ccache and fetched content
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/ccache
            .cache/fetchcontent/${{ matrix.preset }}
          key: dve-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dve-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}-
            dve-${{ matrix.preset }}-
      - name: Configure
        run: |
          # A preset missing from the map above would silently drop the requirement.
          if [ -z "$DVE_EXPECTED_TEST_GROUPS" ]; then
            echo "::error::no DVE_EXPECTED_TEST_GROUPS for preset ${{ matrix.preset }}; add it to the job env"
            exit 1
          fi
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINKER_TYPE=MOLD \
            ${{ matrix.preset == 'linux-gcc-asan' && '-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,pack-relative-relocs' || '' }} \
            "-DDVE_REQUIRE_TEST_GROUPS=$DVE_EXPECTED_TEST_GROUPS" \
            -DFETCHCONTENT_BASE_DIR=$GITHUB_WORKSPACE/.cache/fetchcontent/${{ matrix.preset }}
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build out/build/${{ matrix.preset }} --parallel 4
          ccache --show-stats
          df -h "$GITHUB_WORKSPACE"
      - name: Disk usage (ASan leg)
        if: always() && matrix.preset == 'linux-gcc-asan'
        run: |
          df -h /__w
          du -sh out/build/${{ matrix.preset }} .cache/ccache 2>/dev/null || true
          find out/build/${{ matrix.preset }} -maxdepth 1 -type f -size +100M -printf '%s\n' 2>/dev/null | awk '{n++; t+=$1} END {printf "%d executables over 100 MB, %.1f GB\n", n, t/1e9}'
      # Only pushes to main save the cache: pull requests (and other branches) restore main's
      # entries, so PR runs no longer add a large per-run cache entry each.
      - name: Trim ccache to CCACHE_MAXSIZE before saving
        if: always() && steps.cache.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          ccache --cleanup
          ccache --show-stats
      - name: Save ccache and fetched content (main only, also when tests fail)
        if: always() && steps.cache.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/ccache
            .cache/fetchcontent/${{ matrix.preset }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: CTest (full suite, nothing excluded)
        run: >-
          xvfb-run -a ctest --test-dir out/build/${{ matrix.preset }}
          --output-on-failure --no-tests=error -j4 --timeout 1800
          --output-junit ctest-junit.xml
      # Packaging (formerly its own job; same preset and ccache key as this leg).
      - name: Build the sample game package (tgz, verified)
        if: matrix.preset == 'linux-gcc-player-release'
        run: cmake --build out/build/${{ matrix.preset }} --target dve_sample_game_package
      - name: CPack DEB and TGZ
        if: matrix.preset == 'linux-gcc-player-release'
        run: |
          cpack --config out/build/${{ matrix.preset }}/CPackConfig.cmake -G "DEB;TGZ" -B out/packages
          mkdir -p out/artifacts
          cp out/packages/dve-runtime*.deb out/artifacts/
          cp out/build/${{ matrix.preset }}/game_packages/*.tar.gz out/artifacts/
          for deb in out/packages/*.deb; do echo "== $deb"; dpkg-deb -f "$deb"; done
          ls -l out/packages out/artifacts
          tar -tzf out/artifacts/*.tar.gz | head -50
          dpkg-deb -c out/artifacts/dve-runtime*.deb
      - name: Upload sample game tgz
        if: matrix.preset == 'linux-gcc-player-release'
        uses: actions/upload-artifact@v4
        with:
          name: dve-sample-game-linux-x86_64
          path: out/artifacts/*.tar.gz
          if-no-files-found: error
      - name: Upload runtime deb
        if: matrix.preset == 'linux-gcc-player-release'
        uses: actions/upload-artifact@v4
        with:
          name: dve-runtime-deb
          path: out/artifacts/*.deb
          if-no-files-found: error
      - name: Collapse benchmark (report only, never gates)
        if: matrix.preset == 'linux-gcc-release'
        continue-on-error: true
        run: out/build/${{ matrix.preset }}/dve_collapse_bench --quick --out collapse-bench.json
      - name: Upload collapse benchmark
        if: matrix.preset == 'linux-gcc-release'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: collapse-bench
          path: collapse-bench.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/ctest-junit.xml
            out/build/${{ matrix.preset }}/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore
          retention-days: 14

  windows-msvc:
    # Windows build of the player preset (MSVC, static SDL 3.4.12, Lua 5.4.9, Jolt 5.6.0;
    # libpng/libjpeg-turbo from the runner's vcpkg for the tools), the full CTest suite and the
    # sample game ZIP (docs/PACKAGING.md, "Windows"). Blocking since it was green twice in a row
    # on PR #41.
    #
    # CI configures the preset with the single-config Ninja generator (from a VS developer
    # environment) instead of the preset's Visual Studio generator, so that sccache can wrap cl.exe
    # through CMAKE_<LANG>_COMPILER_LAUNCHER (the VS generator ignores launchers) and so that Ninja
    # compiles files in parallel across targets. --config Release / -C Release stay harmless.
    # sccache cannot cache /Zi (shared PDB) or precompiled-header compiles, so Jolt's /Zi
    # (GENERATE_DEBUG_SYMBOLS) and all PCH use (Jolt, SDL) are turned off for this build only.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PRESET: windows-msvc-player-release
      # sccache stores every object in the GitHub Actions cache (scoped like actions/cache:
      # main's entries are readable from PRs; PR entries only from the same PR).
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Show Visual Studio and CMake
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          "$vswhere" -latest -products '*' -format text | grep -E 'displayName|installationVersion|catalog_productLineVersion' || true
          cmake --version
          python --version
          echo "BUILD_DIR=out/build/$PRESET" >> "$GITHUB_ENV"
          echo "DVE_WORKSPACE=$(cygpath -m "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
          echo "DVE_VCPKG_ROOT=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$(cygpath -m "$GITHUB_WORKSPACE")/.cache/vcpkg-archives,readwrite" >> "$GITHUB_ENV"
      - name: Set up the MSVC developer environment (x64) for Ninja
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Restore vcpkg binary archives (libpng, libjpeg-turbo)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/vcpkg-archives
          key: dve-vcpkg-archives-${{ env.ImageOS }}-${{ env.ImageVersion }}
          restore-keys: |
            dve-vcpkg-archives-${{ env.ImageOS }}-
      - name: Install libpng/libjpeg-turbo with the runner's vcpkg (classic mode)
        run: |
          # --vcpkg-root: the developer environment points VCPKG_ROOT at Visual Studio's own vcpkg.
          mkdir -p .cache/vcpkg-archives
          "$DVE_VCPKG_ROOT/vcpkg" install --vcpkg-root "$DVE_VCPKG_ROOT" libpng:x64-windows libjpeg-turbo:x64-windows
      - name: Save vcpkg binary archives
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/vcpkg-archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Restore fetched content (SDL, Jolt, Lua)
        id: cache
        uses: actions/cache/restore@v4
        with:
          # "-ninja": the FetchContent sub-builds remember their generator, so the folder (and the
          # cache entries) of the former Visual Studio builds cannot be reused.
          path: .cache/fetchcontent/${{ env.PRESET }}-ninja
          key: dve-${{ env.PRESET }}-ninja-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dve-${{ env.PRESET }}-ninja-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}-
            dve-${{ env.PRESET }}-ninja-
      - name: Configure
        # DVE_REQUIRE_TEST_GROUPS: groups this preset must build (cmake/DveTestCoverage.cmake). No
        # Vulkan device or DXC on the hosted runner, so DVE_REQUIRE_COMPLETE_TESTS stays unset.
        run: |
          ninja --version
          command -v lld-link && lld-link --version
          sccache="$(cygpath -m "$SCCACHE_PATH")"
          cmake --preset $PRESET -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_LINKER_TYPE=LLD \
            "-DCMAKE_C_COMPILER_LAUNCHER=$sccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=$sccache" \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DGENERATE_DEBUG_SYMBOLS=OFF \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            "-DCMAKE_TOOLCHAIN_FILE=$DVE_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            "-DFETCHCONTENT_BASE_DIR=$DVE_WORKSPACE/.cache/fetchcontent/$PRESET-ninja" \
            "-DDVE_REQUIRE_TEST_GROUPS=Lua,Jolt,Vulkan,Editor,Player,AssetPipeline,MeshAuthoring,AudioSynth" \
            2>&1 | tee configure.log
          exit ${PIPESTATUS[0]}
      - name: Build
        run: |
          sccache --zero-stats
          cmake --build $BUILD_DIR --config Release --parallel 4 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          sccache --show-stats
          grep -E ' error (C|LNK)[0-9]+' build.log | sort | uniq | head -200 > build-errors.txt || true
          echo "distinct error lines: $(wc -l < build-errors.txt)"
          head -60 build-errors.txt
          exit $status
      - name: Save fetched content
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/fetchcontent/${{ env.PRESET }}-ninja
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: CTest (full suite; skipped tests are listed with their reason)
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIO_DRIVER: dummy
        run: >-
          ctest --test-dir $BUILD_DIR -C Release
          --output-on-failure --no-tests=error -j4 --timeout 1800
          --output-junit ctest-junit.xml
      - name: Build the sample game package (zip, verified)
        run: |
          cmake --build $BUILD_DIR --config Release --target dve_sample_game_package
          ls -l $BUILD_DIR/game_packages
          python -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); [print(f'{i.file_size:>10}  {i.filename}') for i in z.infolist()]" $BUILD_DIR/game_packages/*.zip
      - name: Upload the sample game zip
        uses: actions/upload-artifact@v4
        with:
          name: dve-sample-game-windows-x86_64
          path: ${{ env.BUILD_DIR }}/game_packages/*.zip
          if-no-files-found: error
      - name: CPack ZIP of the engine (not uploaded)
        run: |
          cd $BUILD_DIR
          cpack -G ZIP -C Release 2>&1 | tail -20
          ls -l *.zip
          for z in *.zip; do
            python -c "import sys, zipfile; n = zipfile.ZipFile(sys.argv[1]).namelist(); print(sys.argv[1], len(n), 'entries'); [print('  ' + x) for x in n if x.lower().endswith(('.exe', '.dll', '.txt')) or '/LICENSE' in x]" "$z"
            if python -c "import sys, zipfile, re; sys.exit(0 if any(re.search(r'(mpg123|mp3lame)', x, re.I) for x in zipfile.ZipFile(sys.argv[1]).namelist()) else 1)" "$z"; then
              echo "::error::$z contains an MP3 library"; exit 1
            fi
          done
      - name: Upload Windows logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-logs
          path: |
            configure.log
            build.log
            build-errors.txt
            ${{ env.BUILD_DIR }}/ctest-junit.xml
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest*.log
            ${{ env.BUILD_DIR }}/notices/**/THIRD_PARTY_NOTICES-*.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

  # Runs only on main (push, nightly, dispatch), not on pull requests: PRs no longer have to commit
  # a regenerated SOURCE_MANIFEST.sha256. After merging, run scripts/update_source_manifest.sh on
  # main and commit the result; until then this job fails on main with an error annotation.
  source-manifest:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check SOURCE_MANIFEST.sha256 is fresh
        run: |
          sh scripts/update_source_manifest.sh
          if git diff --quiet -- SOURCE_MANIFEST.sha256; then
            echo "SOURCE_MANIFEST.sha256 is up to date"
            exit 0
          fi
          git diff --stat -- SOURCE_MANIFEST.sha256
          echo "::error file=SOURCE_MANIFEST.sha256::SOURCE_MANIFEST.sha256 is stale on main; run scripts/update_source_manifest.sh and commit the result"
          git diff -U0 -- SOURCE_MANIFEST.sha256 | grep -E '^[+-][0-9a-f]{64} ' | sed -E 's/^([+-])[0-9a-f]{64}  /\1 /' | sort -k2 | head -100
          exit 1

  # Every save on main creates a new Actions cache entry (keys carry the run id), so old entries
  # piled up (6 x 0.5 GB per preset) and pushed the repository over the 10 GB quota, which makes
  # GitHub evict entries least-recently-used first. Keep only the newest main entry per prefix.
  prune-caches:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [ctest, windows-msvc]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete superseded ccache / fetchcontent entries on main
        run: |
          gh api --paginate "repos/$GH_REPO/actions/caches?ref=refs/heads/main&per_page=100" \
            -q '.actions_caches[] | select(.key | startswith("dve-")) | [.id, .key, .created_at, .size_in_bytes] | @tsv' > caches.tsv
          # prefix = key without the trailing -<run id>-<attempt>
          sort -t$'\t' -k3,3r caches.tsv | awk -F'\t' '{p=$2; sub(/-[0-9]+-[0-9]+$/,"",p); sub(/-[0-9a-f]{64}$/,"",p); if (seen[p]++) print $1"\t"$2"\t"$4}' > stale.tsv
          echo "stale entries: $(wc -l < stale.tsv), $(awk -F'\t' '{s+=$3} END {printf "%.0f MiB", s/1048576}' stale.tsv)"
          while IFS=$'\t' read -r id key size; do
            echo "delete $key"; gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" || true
          done < stale.tsv
          gh api "repos/$GH_REPO/actions/cache/usage"
