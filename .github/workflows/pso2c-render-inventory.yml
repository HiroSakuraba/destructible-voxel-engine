name: PSO-2C live-renderer pipeline inventory
on:
  pull_request:
    paths:
      - "include/dve/render/live_environment_renderer.hpp"
      - "include/dve/render/dashr_shell.hpp"
      - "src/render/live_environment_renderer.cpp"
      - "src/render/dashr_shell.cpp"
      - "tests/test_live_environment_renderer.cpp"
      - "tests/test_dashr_shell.cpp"
      - "docs/PSO2C_LIVE_RENDERER_INVENTORY.md"
      - ".github/workflows/pso2c-render-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-inventory:
    name: Exact live and DASHR precompiled variants (Null RHI)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure rendering modules
        run: |
          cmake -S . -B build-pso2c -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDVE_BUILD_TESTS=ON -DDVE_BUILD_RHI=ON -DDVE_BUILD_PLATFORM=ON \
            -DDVE_BUILD_PLAYER=ON -DDVE_BUILD_EDITOR=OFF \
            -DDVE_BUILD_NATIVE_EDITOR=OFF -DDVE_BUILD_ASSET_COOKER=OFF \
            -DDVE_BUILD_ASSET_PIPELINE_TESTS=OFF -DDVE_BUILD_BENCHMARK=OFF \
            -DDVE_ENABLE_SDL3_HOST=OFF -DDVE_ENABLE_FLUODDITY=OFF \
            -DDVE_ENABLE_SOFT_BODIES=OFF -DDVE_ENABLE_CPU_HAIR=OFF \
            -DDVE_ENABLE_SIMULATION_ENERGY_COMPILER=OFF
      - name: Build live renderer and DASHR tests
        run: cmake --build build-pso2c --target dve_live_environment_renderer_tests dve_dashr_shell_tests --parallel 2
      - name: Run complete variant inventory before first draw
        env:
          DVE_REQUIRE_COMPLETE_TESTS: "1"
        run: ctest --test-dir build-pso2c -R '^(dve_live_environment_renderer_tests|dve_dashr_shell_tests)$' -V --output-on-failure
