name: T5 DVE baked normal quality and independent libktx validation
on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "tests/test_material_bake_bc5_quality.cpp"
      - "tests/test_texture_ktx2_export.cpp"
      - "src/texture_ktx2_export.cpp"
      - "docs/TEXTURE_T5_BAKE_KTX2_VALIDATION.md"
      - ".github/workflows/texture-t5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-bake-quality:
    name: Real DVE material bake to BC5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libpng-dev libjpeg-dev
      - name: Configure with actual DVE material baker enabled
        run: |
          cmake -S . -B build-bake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDVE_BUILD_TESTS=ON -DDVE_BUILD_RHI=ON -DDVE_BUILD_PLATFORM=ON -DDVE_BUILD_PLAYER=ON \
            -DDVE_BUILD_EDITOR=ON -DDVE_BUILD_NATIVE_EDITOR=OFF \
            -DDVE_BUILD_ASSET_COOKER=OFF -DDVE_BUILD_ASSET_PIPELINE_TESTS=OFF \
            -DDVE_BUILD_BENCHMARK=OFF -DDVE_ENABLE_SDL3_HOST=OFF \
            -DDVE_ENABLE_FLUODDITY=OFF -DDVE_ENABLE_SOFT_BODIES=OFF \
            -DDVE_ENABLE_CPU_HAIR=OFF -DDVE_ENABLE_SIMULATION_ENERGY_COMPILER=OFF \
            -DDVE_ENABLE_KTX2_EXPORT=OFF
      - name: Compile actual bake and BC5 quality tests
        run: cmake --build build-bake --target dve_material_bake_bc5_quality_tests dve_texture_bc5_tests dve_bc5_shader_mapping_tests --parallel 2
      - name: Verify three actual DVE-baked materials
        env:
          DVE_REQUIRE_COMPLETE_TESTS: "1"
        run: ctest --test-dir build-bake -R '^(dve_material_bake_bc5_quality_tests|dve_texture_bc5_tests|dve_bc5_shader_mapping_tests)$' --output-on-failure -V

  libktx-interop:
    name: Pinned Khronos libktx 4.4.2 independent roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev
      - name: Checkout signed stable Khronos libktx release
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch v4.4.2 \
            https://github.com/KhronosGroup/KTX-Software.git \
            "$RUNNER_TEMP/KTX-Software"
          git -C \"$RUNNER_TEMP/KTX-Software" describe --tags --exact-match
      - name: Compile and install upstream libktx (not DVE mocks)
        run: |
          cmake -S "$RUNNER_TEMP/KTX-Software" -B "$RUNNER_TEMP/ktx-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DKTX_FEATURE_TOOLS=OFF -DKTX_FEATURE_TESTS=OFF \
            -DKTX_FEATURE_VK_UPLOAD=OFF -DKTX_FEATURE_GL_UPLOAD=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ktx-install"
          cmake --build "$RUNNER_TEMP/ktx-build" --target ktx --parallel 2
          cmake --install "$RUNNER_TEMP/ktx-build" --prefix "$RUNNER_TEMP/ktx-install"
      - name: Configure DVE native exporter with external libktx
        run: |
          cmake -S . -B build-ktx -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDVE_BUILD_TESTS=ON -DDVE_BUILD_RHI=ON -DDVE_BUILD_PLATFORM=ON -DDVE_BUILD_PLAYER=ON \
            -DDVE_BUILD_EDITOR=OFF -DDVE_BUILD_NATIVE_EDITOR=OFF \
            -DDVE_BUILD_ASSET_COOKER=OFF -DDVE_BUILD_ASSET_PIPELINE_TESTS=OFF \
            -DDVE_BUILD_BENCHMARK=OFF -DDVE_ENABLE_SDL3_HOST=OFF \
            -DDVE_ENABLE_FLUODDITY=OFF -DDVE_ENABLE_SOFT_BODIES=OFF \
            -DDVE_ENABLE_CPU_HAIR=OFF -DDVE_ENABLE_SIMULATION_ENERGY_COMPILER=OFF \
            -DDVE_ENABLE_KTX2_EXPORT=ON \
            "-DDVE_KTX_INCLUDE_DIR=$RUNNER_TEMP/ktx-install/include" \
            "-DDVE_KTX_LIBRARY=$RUNNER_TEMP/ktx-install/lib/libktx.so"
      - name: Compile genuine libktx/DVE interoperability
        run: cmake --build build-ktx --target dve_texture_ktx2_export_tests dve_texture_t1_format_tests --parallel 2
      - name: Read native KTX2 independently with libktx
        env:
          DVE_REQUIRE_COMPLETE_TESTS: "1"
          LD_LIBRARY_PATH: "${{ runner.temp }}/ktx-install/lib"
        run: ctest --test-dir build-ktx -R '^(dve_texture_ktx2_export_tests|dve_texture_t1_format_tests)$' --output-on-failure -V
