name: v2.35 foundations

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  repository-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure source-only repository
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDVE_BUILD_BENCHMARK=OFF
          -DDVE_BUILD_ASSET_COOKER=OFF
          -DDVE_BUILD_ASSET_PIPELINE_TESTS=OFF
          -DDVE_BUILD_EDITOR=OFF
          -DDVE_BUILD_NATIVE_EDITOR=OFF
          -DDVE_BUILD_PLATFORM=OFF
          -DDVE_BUILD_RHI=OFF
          -DDVE_BUILD_DEVICE_TEST_RUNNER=OFF
          -DDVE_BUILD_AUDIO_SYNTH=OFF
          -DDVE_BUILD_LEGACY_X11_HOST=OFF
          -DDVE_ENABLE_SDL3_HOST=OFF
          -DDVE_ENABLE_VULKAN_BUFFER_BACKEND=OFF
          -DDVE_ENABLE_FLUODDITY=OFF
          -DDVE_ENABLE_SOFT_BODIES=OFF
          -DDVE_ENABLE_CPU_HAIR=OFF
          -DDVE_ENABLE_VFX_PARTICLES=OFF
          -DDVE_ENABLE_PBF_LIQUID=OFF
          -DDVE_ENABLE_SIMULATION_ENERGY_COMPILER=OFF
          -DDVE_ENABLE_BSPLINE_CLOTH=OFF
          -DDVE_ENABLE_GRID_FLUIDS=OFF
          -DDVE_ENABLE_FLIP_LIQUIDS=OFF
      - name: Build core and v2.35 contract target
        run: cmake --build build --target dve_v235_foundations_tests --parallel 2
      - name: Run v2.35 CTest target
        run: ctest --test-dir build --output-on-failure -R '^dve_v235_foundations_tests$'

  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Strict deterministic contract suite
        run: ./scripts/run_v235_foundation_tests.sh
      - name: Sanitized deterministic contract suite
        run: ./scripts/run_v235_foundation_tests.sh --sanitize

  dashr-render-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure DASHR render contracts
        run: >-
          cmake -S . -B build-dashr -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDVE_BUILD_TESTS=ON
          -DDVE_BUILD_BENCHMARK=OFF
          -DDVE_BUILD_ASSET_COOKER=OFF
          -DDVE_BUILD_ASSET_PIPELINE_TESTS=OFF
          -DDVE_BUILD_EDITOR=OFF
          -DDVE_BUILD_NATIVE_EDITOR=OFF
          -DDVE_BUILD_PLATFORM=OFF
          -DDVE_BUILD_RHI=ON
          -DDVE_BUILD_DEVICE_TEST_RUNNER=OFF
          -DDVE_BUILD_AUDIO_SYNTH=OFF
          -DDVE_BUILD_LEGACY_X11_HOST=OFF
          -DDVE_ENABLE_SDL3_HOST=OFF
          -DDVE_ENABLE_VULKAN_BUFFER_BACKEND=ON
          -DDVE_ENABLE_FLUODDITY=OFF
          -DDVE_ENABLE_SOFT_BODIES=OFF
          -DDVE_ENABLE_CPU_HAIR=OFF
          -DDVE_ENABLE_VFX_PARTICLES=OFF
          -DDVE_ENABLE_PBF_LIQUID=OFF
          -DDVE_ENABLE_SIMULATION_ENERGY_COMPILER=OFF
          -DDVE_ENABLE_BSPLINE_CLOTH=OFF
          -DDVE_ENABLE_GRID_FLUIDS=OFF
          -DDVE_ENABLE_FLIP_LIQUIDS=OFF
      - name: Build DASHR and MRT contracts
        run: >-
          cmake --build build-dashr --parallel 2 --target
          dve_rhi_mrt_tests
          dve_dashr_surface_tests
          dve_dashr_seam_map_tests
          dve_dashr_atlas_tests
          dve_dashr_shell_tests
          dve_rhi_vulkan
      - name: Run DASHR and MRT contracts
        run: |
          ctest --test-dir build-dashr --output-on-failure \
            -R "^(dve_rhi_mrt_tests|dve_dashr_surface_tests|dve_dashr_seam_map_tests|dve_dashr_atlas_tests|dve_dashr_shell_tests)$"
      - name: Validate DASHR shader inventory and contracts
        run: ./scripts/validate_shaders.sh
      - name: Package DASHR work
        uses: actions/upload-artifact@v4
        with:
          name: dve-dashr-surface-port-v1
          if-no-files-found: error
          compression-level: 9
          path: |
            .github/workflows/v235-foundations.yml
            CHANGELOG.md
            CMakeLists.txt
            docs/DASHR_PORT.md
            include/dve/dashr_seam_map.hpp
            include/dve/dashr_surface.hpp
            include/dve/render/dashr_atlas.hpp
            include/dve/render/dashr_shell.hpp
            include/dve/render/main_material_table.hpp
            include/dve/rhi/device.hpp
            include/dve/rhi/null_device.hpp
            shaders/common/dashr_live_trace.hlsli
            shaders/common/dashr_surface.hlsli
            shaders/dashr_atlas_ps.hlsl
            shaders/dashr_atlas_vs.hlsl
            shaders/dashr_edge_fill.hlsl
            shaders/dashr_shell_pbr_ps.hlsl
            shaders/dashr_shell_ps.hlsl
            shaders/dashr_shell_shadow_ps.hlsl
            shaders/dashr_shell_vs.hlsl
            shaders/material_mapping_reference.hlsl
            shaders/shader_manifest.json
            src/dashr_seam_map.cpp
            src/dashr_surface.cpp
            src/render/dashr_atlas.cpp
            src/render/dashr_shell.cpp
            src/render/main_material_table.cpp
            src/rhi/null_device.cpp
            src/rhi/vulkan_device.cpp
            src/rhi/vulkan_loader_api.hpp
            tests/test_dashr_atlas.cpp
            tests/test_dashr_seam_map.cpp
            tests/test_dashr_shell.cpp
            tests/test_dashr_surface.cpp
            tests/test_main_material_table.cpp
            tests/test_rhi_mrt.cpp
            third_party/DASHR-LICENSE.txt
            third_party/DASHR-NOTICE.md
